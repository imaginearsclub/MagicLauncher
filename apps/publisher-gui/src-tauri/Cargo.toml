[package]
name = "publisher-gui"
description = "Imaginears PackPublisher (the window version of pack-publisher)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "imaginears-pack-publisher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
static_vcruntime = "3"

[dependencies]
pack-publisher = { path = "../../../crates/pack-publisher" }
pack-builder = { path = "../../../crates/pack-builder" }
launcher-core.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1"
tauri-plugin-updater = "2"
