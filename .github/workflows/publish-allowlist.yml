name: Publish Alpha allowlist

# channels/alpha-testers.txt -> signed launcher/channels/alpha.json (+ .sig) on the CDN.
# Signed with ALLOWLIST_SIGNING_KEY (its own key, never the update-signing key); the
# launcher only shows the Alpha channel to accounts on a correctly signed list.
on:
  push:
    branches: [main]
    paths: [channels/alpha-testers.txt, scripts/build_allowlist.py]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-allowlist
  cancel-in-progress: false

env:
  BUCKET: ${{ vars.MAGIC_BUCKET }}
  CDN: ${{ vars.MAGIC_CDN }}
  DISTRIBUTION_ID: ${{ vars.MAGIC_DISTRIBUTION_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ vars.MAGIC_AWS_REGION || 'us-east-1' }}

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Hosting variables must be set
        run: |
          missing=""
          for v in BUCKET CDN DISTRIBUTION_ID; do [ -n "${!v}" ] || missing="$missing MAGIC_$v"; done
          if [ -n "$missing" ]; then
            echo "Set these repo variables first (Settings > Secrets and variables > Actions):$missing" >&2
            exit 1
          fi
      - uses: actions/checkout@v7

      - name: Build the list (names -> UUIDs)
        run: |
          set -euo pipefail
          mkdir out
          python3 -I scripts/build_allowlist.py channels/alpha-testers.txt > out/alpha.json
          jq . out/alpha.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ALLOWLIST_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "ALLOWLIST_SIGNING_KEY secret is missing" >&2; exit 1; }
          npx --yes @tauri-apps/cli@2.12.4 signer sign out/alpha.json
          test -s out/alpha.json.sig

      - name: Upload
        run: |
          set -euo pipefail
          for f in alpha.json alpha.json.sig; do
            aws s3 cp "out/$f" "s3://$BUCKET/pack/launcher/channels/$f" \
              --cache-control no-cache --only-show-errors
          done
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/launcher/channels/*" --query Invalidation.Id --output text
          for i in $(seq 1 20); do
            if curl -fsS "$CDN/launcher/channels/alpha.json" | cmp -s - out/alpha.json; then
              echo "Allowlist live: $(jq -r '[.members[].name] | join(", ")' out/alpha.json)"; exit 0
            fi
            sleep 15
          done
          echo "CDN still serving an old allowlist" >&2; exit 1
