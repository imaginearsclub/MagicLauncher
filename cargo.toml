[workspace]
resolver = "3"
members = [
  "crates/launcher-core",
  "crates/pack-builder",
  "crates/pack-publisher",
  "src-tauri",
  "apps/publisher-gui/src-tauri",
]

# The single source of truth for the release version (SemVer).
# Every crate inherits it, and tauri.conf.json deliberately has no `version`
# so the bundle (msi/dmg/AppImage/deb) falls back to this value too.
[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.94"
publish = false

# Small, fast launcher binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace.dependencies]
launcher-core = { path = "crates/launcher-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha1 = "0.11"
hex = "0.4"
futures-util = "0.3"
