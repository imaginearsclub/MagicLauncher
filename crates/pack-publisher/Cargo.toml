[package]
name = "pack-publisher"
description = "Builds the Imaginears Magic Pack from a CurseForge instance and publishes it to S3 + CloudFront."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pack-builder = { path = "../pack-builder" }
launcher-core.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
semver = "1"
clap = { version = "4", features = ["derive"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-cloudfront = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rpassword = "7"

[build-dependencies]
static_vcruntime = "3"
